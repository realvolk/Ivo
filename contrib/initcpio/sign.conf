# /etc/ivo/sign.conf — configuration for the Ivo mkinitcpio post hook.
# Sourced by /etc/initcpio/post/ivo. Shell syntax, no spaces around =.

# Where ivo-sign is installed. Bare name if it's on $PATH.
IVO_SIGN=ivo-sign

# Path to the Ivo config on the mounted filesystem.
CONFIG=/boot/ivo/config.toml

# Where the files the config references are mounted.
ROOT=/boot

# For btrfs subvol entries: the mount of the top-level (subvolid=5).
# Leave empty if not using subvolumes.
SUBVOL_ROOT=

# Ed25519 secret key for config signing. Leave empty to skip signing.
# Point this at a key file (mode 0600) or leave empty for hash-only.
KEY=

# Extra args passed to ivo-sign --hash, e.g. ISO images for iso-boot
# entries. One per line, no quoting.
# ISO=